<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rody's World ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; --card-bg: #1e1e1e; --primary: #ff4b4b; --secondary: #ff7676; --accent: #2d2d2d; --border-radius: 16px; }
        [data-theme="light"] { --bg-color: #f8f9fa; --text-color: #212529; --card-bg: #ffffff; --primary: #e63946; --secondary: #ff6b6b; --accent: #e9ecef; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s ease; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1, h2 { color: var(--primary); margin: 0; }
        button { cursor: pointer; font-family: 'Cairo', sans-serif; border: none; outline: none; border-radius: 8px; transition: 0.2s; }
        .theme-toggle { background: var(--card-bg); color: var(--text-color); padding: 10px 15px; border: 1px solid var(--accent); border-radius: 20px; }
        .counter-box { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; text-align: center; padding: 20px; border-radius: var(--border-radius); margin-bottom: 30px; box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3); }
        .counter-box .number { font-size: 3rem; font-weight: 800; margin: 10px 0; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; }
        .add-btn { background: var(--primary); color: white; padding: 10px 20px; font-weight: bold; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: center; padding: 12px; background: var(--bg-color); margin-bottom: 10px; border-radius: 8px; gap: 12px; }
        li.completed span.text-content { text-decoration: line-through; opacity: 0.5; }
        .text-content { flex: 1; word-break: break-word; }
        .delete-btn { background: transparent; color: #888; font-size: 1.2rem; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
        .notes-card { background: var(--card-bg); border-left: 5px solid var(--primary); }
        .note-item { background: rgba(230, 57, 70, 0.1); border: 1px dashed var(--primary); }
        .memory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .memory-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .memory-item img { width: 100%; height: 100%; object-fit: cover; }
        .del-img { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; padding: 5px; border-radius: 50%; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Rody's World ✨</h1>
        <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
    </div>
    <div class="counter-box">
        <h3>بدأنا كلامنا من</h3>
        <div class="number" id="days-count">0</div>
        <h3>يوم من الضحك، الرغي، والمواقف الحلوة ❤️</h3>
    </div>
    <div class="grid-container">
        <div class="card">
            <h2>Our Plans 🌍</h2>
            <div class="input-group"><input type="text" id="our-input" placeholder="نفسنا نعمل إيه سوا؟"><button class="add-btn" onclick="addItem('plans/ourPlans', 'our-input')">إضافة</button></div>
            <ul id="our-list"></ul>
        </div>
        <div class="card">
            <h2>Her Plans 🌸</h2>
            <div class="input-group"><input type="text" id="her-input" placeholder="خططها وأحلامها..."><button class="add-btn" onclick="addItem('plans/herPlans', 'her-input')">إضافة</button></div>
            <ul id="her-list"></ul>
        </div>
        <div class="card">
            <h2>My Plans 🎯</h2>
            <div class="input-group"><input type="text" id="his-input" placeholder="خططك ومشاريعك..."><button class="add-btn" onclick="addItem('plans/hisPlans', 'his-input')">إضافة</button></div>
            <ul id="his-list"></ul>
        </div>
    </div>
    <div class="card notes-card" style="margin-bottom: 30px;">
        <h2>أفكارنا وانطباعاتنا 💭</h2>
        <div class="input-group"><input type="text" id="notes-input" placeholder="اكتب فكرة مجنونة أو حاجة لفتت انتباهك..."><button class="add-btn" onclick="addItem('notes', 'notes-input')">إضافة</button></div>
        <ul id="notes-list"></ul>
    </div>
    <div class="card">
        <h2>Memory Wall 📸</h2>
        <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 5px;">(ابعت الصورة على ديسكورد، انسخ الـ Image Link، وحطه هنا)</p>
        <div class="input-group"><input type="text" id="img-input" placeholder="ضع رابط الصورة (Image URL) هنا..."><button class="add-btn" onclick="addPhoto()">إضافة صورة</button></div>
        <div class="memory-grid" id="memory-wall"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // إعدادات الفايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB6snhRvUF8WFxhidaTLXFD2Chz-g4xvWk",
            authDomain: "rody-world.firebaseapp.com",
            databaseURL: "https://rody-world-default-rtdb.firebaseio.com",
            projectId: "rody-world",
            storageBucket: "rody-world.firebasestorage.app",
            messagingSenderId: "152266457006",
            appId: "1:152266457006:web:824a638abaa2fb74fd123f",
            measurementId: "G-BSMHNBG1QR"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        const startDate = new Date('2026-07-14T00:00:00');
        document.getElementById('days-count').innerText = Math.floor(Math.abs(new Date() - startDate) / (1000 * 60 * 60 * 24));

        function toggleTheme() { document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'light' ? '' : 'light'); }
        
        function setupList(dbPath, listId, isNote = false) {
            db.ref(dbPath).on('value', (snapshot) => {
                const listEl = document.getElementById(listId);
                listEl.innerHTML = '';
                snapshot.forEach((child) => {
                    const key = child.key, data = child.val();
                    const text = typeof data === 'string' ? data : data.text, isCompleted = typeof data === 'string' ? false : (data.completed || false);
                    const li = document.createElement('li');
                    if(isCompleted) li.classList.add('completed');
                    if(isNote) li.classList.add('note-item');
                    if(!isNote) {
                        const cb = document.createElement('input');
                        cb.type = 'checkbox'; cb.checked = isCompleted;
                        cb.onchange = (e) => db.ref(`${dbPath}/${key}`).set({text: text, completed: e.target.checked});
                        li.appendChild(cb);
                    }
                    li.innerHTML += `<span class='text-content'>${text}</span><button class='delete-btn' onclick="db.ref('${dbPath}/${key}').remove()">✖</button>`;
                    listEl.appendChild(li);
                });
            });
        }
        function addItem(dbPath, inputId) { const input = document.getElementById(inputId); if(input.value.trim() !== '') { db.ref(dbPath).push({text: input.value.trim(), completed: false}); input.value = ''; } }
        function addPhoto() { const input = document.getElementById('img-input'); if(input.value.trim() !== '') { db.ref('memoryWall').push({url: input.value.trim()}); input.value = ''; } }
        
        window.onload = () => {
            setupList('plans/ourPlans', 'our-list');
            setupList('plans/herPlans', 'her-list');
            setupList('plans/hisPlans', 'his-list');
            setupList('notes', 'notes-list', true);
            db.ref('memoryWall').on('value', (snapshot) => {
                const wall = document.getElementById('memory-wall'); wall.innerHTML = '';
                snapshot.forEach((child) => { wall.innerHTML += `<div class='memory-item'><img src='${child.val().url}'><button class='del-img' onclick="db.ref('memoryWall/${child.key}').remove()">✖</button></div>`; });
            });
        };
    </script>
</body>
</html>
